# Task work lives on branches in each user's own fork: pull requests to this
# repo are never needed, and would publish one user's work to everyone. Close
# them with a pointer. pull_request_target runs with this repo's token but
# never checks out or runs the pull request's code.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # Only on the task repo itself: repos made from it with "Use this template"
    # (and forks with Actions on) copy this file, and their own pull requests
    # must stay open.
    if: github.repository == 'Dev-Jets/devy-interview-task'
    runs-on: ubuntu-latest
    steps:
      - name: Close with a note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks! Task work stays on the devyai-task branch of your own fork; Devy finds it there, so nothing needs merging here. When you're done, set \"status\": \"done\" in .devy/task.json and push, or tap I'm done in Devy."
